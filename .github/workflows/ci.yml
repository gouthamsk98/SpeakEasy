name: CI
on: [push, pull_request]

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: GPU backends compile (no GPU on CI runners)
        if: runner.os == 'Linux'
        run: cargo check -p asr-app -p asr-cli --features cuda
      - name: DirectML backend compiles
        if: runner.os == 'Windows'
        run: cargo check -p asr-app -p asr-cli --features directml

  python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cd research
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev]'
          (cd ../bindings/python && maturin build --release -o dist && pip install dist/*.whl)
          ruff check .
          pytest

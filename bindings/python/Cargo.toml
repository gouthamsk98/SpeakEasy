[package]
name = "asr-native"
description = "Python bindings to the Rust feature extractor (and later the engine) for train/inference parity."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "asr_native"
crate-type = ["cdylib"]

[dependencies]
asr-features.workspace = true
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310"] }
numpy = "0.30"

[project]
name = "asr-research"
version = "0.1.0"
description = "Training & experiments for glossectomy-speech recognition. Ships models to the Rust runtime via ONNX."
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = [
  "torch>=2.4",
  "numpy",
  "soundfile",
  "pyyaml",
  "jiwer",
  "onnx",
  "onnxruntime-gpu",
  "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "maturin>=1.7"]

[project.scripts]
asr-prepare = "asr_research.prepare_manifest:main"
asr-train = "asr_research.train:main"
asr-eval = "asr_research.evaluate:main"
asr-export = "asr_research.export_onnx:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
